#example configuration

substitutions:
  device_name: helo

external_components:
  - source: esphome/components

esphome:
  name: ${device_name}
  friendly_name: ${device_name}
  comment: ${device_name} sauna controller
  area: Sauna
  platformio_options:
    board_build.flash_mode: dio

esp32:
  #change right board for your device
  board: esp32-s3-devkitc-1
  flash_size: 8MB
#  framework:
#    type: arduino #arduino or esp-idf tested on both

# Enable logging
logger:
  level: DEBUG
  # disable putting logging on the HW uart
  baud_rate: 0

# Enable Home Assistant API
api:

# Enable OTA updates and read logs with wifi
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  #recommended to manually configure ip address
  manual_ip:
    # Set this to the IP of the ESPhome device
    static_ip: 192.168.1.192
    # Set this to the IP address of the router. Often ends with .1
    gateway: 192.168.1.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.255.0

#for faster debug or as an interface take resources. should turn off if not in use
web_server:
  port: 80
  version: 3

uart:
    # change right pins for your ESPhome device
    rx_pin: GPIO1
    tx_pin: GPIO2
    baud_rate: 19200
    data_bits: 8
    parity: EVEN
    stop_bits: 1

sauna360:
  #flow_control_pin: GPIO7 #PIN to set transmit DE ~RE pins high on RS485 board

binary_sensor:
- platform: sauna360
  heater_status:
    name: "Heater Status"
- platform: sauna360
  light_status:
    name: "Light Status"
- platform: sauna360
  ready_status: 
    name: "Ready Status"

sensor:
- platform: wifi_signal
  name: "${device_name} WiFi Signal"
  update_interval: 60s
- platform: sauna360
  current_temperature:
    name: "Current Temperature"
- platform: sauna360
  setting_temperature:
    name: "Setting Temperature"
- platform: sauna360
  remaining_time:
    name: "Remaining time"
- platform: sauna360
  setting_bath_time:
    name: "Setting Bath Time"
- platform: sauna360
  humidity_setting: #combi/steam models
    name: "Setting Humidity"
- platform: sauna360
  humidity_percentage: #combi/steam models
    name: "Humidity"

button:
- platform: sauna360
  heater_on:
    name: "On"
- platform: sauna360
  heater_off:
    name: "Off "
- platform: sauna360
  heater_standby: #use only if elite panel and stanby setting is on from panel.
    name: "Standby"
- platform: sauna360
  heater_power_toggle:
    name: "Power Toggle"

number:
- platform: sauna360
  bath_time:
    name: "Bath Time"
    mode: box # box / slider
    bath_time_default: 90 #1-360min
- platform: sauna360
  bath_temperature:
    name: "Bath Temperature"
    mode: box # box / slider
    bath_temperature_default: 65 #40-110°C
