substitutions:
  device_name: helo

external_components:
  - source: esphome/components

esphome:
  name: ${device_name}
  comment: ${device_name} sauna controller
  area: Sauna
  platformio_options:
    board_build.flash_mode: dio

esp32:
  #change right board for your device
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG
  # disable putting logging on the HW uart
  baud_rate: 0

# Enable Home Assistant API
api:

# Enable OTA updates and read logs with wifi
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  #recommended to manually configure ip address
  manual_ip:
    # Set this to the IP of the ESPhome device
    static_ip: 192.168.1.176
    # Set this to the IP address of the router. Often ends with .1
    gateway: 192.168.1.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    subnet: 255.255.255.0

uart:
  # change right pins for your ESPhome device
  tx_pin: GPIO5
  rx_pin: GPIO6
  baud_rate: 19200
  data_bits: 8
  parity: EVEN
  stop_bits: 1

sauna360:
  flow_control_pin: GPIO7

sensor:
- platform: wifi_signal
  name: "${device_name} WiFi Signal"
  update_interval: 60s
- platform: sauna360
  current_temperature:
    name: "Current Temperature"
- platform: sauna360
  setting_temperature:
    name: "Setting Temperature"
- platform: sauna360
  remaining_time:
    name: "Remaining time"
- platform: sauna360
  humidity_setting:
    name: "Setting Humidity"
- platform: sauna360
  humidity_percentage:
    name: "Humidity"

button:
- platform: sauna360
  elite_heater_on: #use only if elite panel
    name: "On"
- platform: sauna360
  elite_heater_off: #use only if elite panel
    name: "Off"
- platform: sauna360
  elite_heater_standby: #use only if elite panel
    name: "Standby"
- platform: sauna360
  pure_power_toggle: #use only if pure panel
    name: "Power Toggle"
