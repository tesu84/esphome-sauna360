  icon: "mdi:wifi"
- platform: sauna360
  current_temperature:
    name: "Current Temperature"
- platform: sauna360
  setting_temperature:
    name: "Setting Temperature"
- platform: sauna360
  remaining_time:
    name: "Remaining Time"
- platform: sauna360
  setting_bath_time:
    name: "Setting Bath Time"
- platform: sauna360
  humidity_setting: #combi/steam pure models 1-10
    name: "Sensor Setting Humidity Step"
- platform: sauna360
  humidity_percentage_setting: #combi/steam elite models with Rh% Sensor
    name: "Sensor Setting Humidity Percentage"
- platform: sauna360
  humidity_percentage: #combi/steam elite models with Rh% Sensor
- platform: sauna360
  humidity_percentage:
    name: "Humidity"
- platform: sauna360
  total_uptime:
    name: "Total Uptime"
- platform: sauna360
  max_bath_temperature:
    name: "Max Bath Temperature"
- platform: sauna360
  overheating_pcb_limit:
    name: "Overheating PCB Limit"
- platform: sauna360
  standby_temperature_reduction:
    name: "Standby Temperature Reduction"
- platform: sauna360
  external_switch_renew_bathtime:
    name: "External Switch Renew Bathtime"

button:
- platform: sauna360
  heater_on:
    name: "On"
- platform: sauna360
  heater_off:
    name: "Off "
- platform: sauna360
  heater_standby:
    name: "Standby"
- platform: sauna360
  heater_power_toggle:
    name: "Power Toggle"

number:
- platform: sauna360
