# example full configuration from dev branch
# devices Atom S3 Lite + tail485

substitutions:
  device_name: olea103

external_components:
  - source:
      type: git
      url: https://github.com/tesu84/esphome-sauna360/
      ref: develop
    components: [ sauna360 ]

esphome:
  name: ${device_name}
  friendly_name: ${device_name}
  comment: ${device_name} sauna controller
  area: Sauna

esp32:
  #change right board for your device
  board: esp32-s3-devkitc-1

# Enable logging
logger:
  level: DEBUG
  # disable putting logging on the HW uart
  baud_rate: 0

# Enable Home Assistant API
api:

# Enable OTA updates and read logs with wifi
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

uart:
    # change right pins for your ESPhome device
    rx_pin: GPIO1
    tx_pin: GPIO2
    baud_rate: 19200
    data_bits: 8
    parity: EVEN
    stop_bits: 1

sauna360:
  #flow_control_pin: GPIO7 #PIN to set transmit DE ~RE pins high on RS485 board

binary_sensor:
- platform: sauna360
  heater_status:
    name: "Heater Status"
- platform: sauna360
  light_status:
    name: "Light Status"
- platform: sauna360
  ready_status: 
    name: "Ready Status"
- platform: sauna360
  relay_x3_x4_status: 
    name: "Relay X3-X4 Status"
- platform: sauna360
  relay_x5_x6_status: 
    name: "Relay X5-X6 Status"
- platform: sauna360
  relay_x7_x8_status: 
    name: "Relay X7-X8 Status"
- platform: sauna360
  relay_x9_x10_status: 
    name: "Relay X9-X10 Status"
- platform: sauna360
  relay_x11_x12_status: 
    name: "Relay X11-X12 Status"
- platform: sauna360
  relay_x13_x14_status: 
    name: "Relay X13-X14 Status"
- platform: sauna360
  relay_x15_x16_status: 
    name: "Relay X15-X16 Status"
- platform: sauna360
  relay_x17_x18_status: 
    name: "Relay X17-X18 Status"

sensor:
- platform: wifi_signal
